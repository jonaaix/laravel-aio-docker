[program:agent-chat]
process_name=%(program_name)s
command=node /opt/agent-chat/starter.mjs
user=laravel
directory=/app
environment=HOME="/home/laravel",HOST="0.0.0.0",PORT="3000",NUXT_WORKING_DIR="/app",NUXT_DATA_DIR="/home/laravel/.config/agent-chat"
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
