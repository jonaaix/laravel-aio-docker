; Long-lived Playwright MCP server, spoken over HTTP on 127.0.0.1:9223.
; Registered globally in the image (see Dockerfile) as `claude mcp add --transport http`,
; so the Claude CLI connects to this shared daemon instead of spawning its own stdio
; child. On HTTP the MCP hands each connected client its own browser context by default
; (--shared-browser-context is off), which stops parallel Claude subagents from stomping
; on each other's tabs, clicks and screenshots. --isolated keeps the profile in RAM so
; concurrent contexts don't fight over the on-disk singleton lock; --headless is Docker
; reality. Bound to 127.0.0.1: nothing outside the container needs to talk to it. Clients
; must still address it as http://localhost:9223/mcp — the MCP's DNS-rebinding guard
; compares the Host header against the literal name `localhost:<port>` and 403s the
; loopback IP ("Access is only allowed at localhost:9223").
; Priority well below the default (999) so this comes up before claude-threads and any
; other MCP consumer.
[program:playwright-mcp]
process_name=%(program_name)s
; Invoke cli.js directly instead of the package's `bin` shim: the shim's binary name has
; changed between releases (mcp-server-playwright → playwright-mcp → …); the module path
; and cli.js entry haven't.
command=/usr/bin/env node /opt/npm-global/lib/node_modules/@playwright/mcp/cli.js --host 127.0.0.1 --port 9223 --headless --isolated
priority=100
user=laravel
directory=/home/laravel
autostart=true
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
